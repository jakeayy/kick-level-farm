[package]
name = "kick-level-farm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
# rustls with the small `ring` provider instead of aws-lc.
# Keep `http2`: Kick's firewall answers reqwest's HTTP/1.1 requests with 403 "blocked by security policy".
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "gzip", "http2", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "time", "signal", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.20", default-features = false }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std", "chrono"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Size over raw speed: the bot is I/O-bound, and ring uses assembly for crypto anyway.
opt-level = "s"
# Unwinding is kept on purpose: a panic in one task must not take the whole bot down.
