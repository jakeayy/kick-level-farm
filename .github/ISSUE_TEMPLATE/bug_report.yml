name: Bug report
description: Something doesn't work (or stopped working after a Kick update)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Never post your `session_token` cookie or Discord webhook URL.** Check your config and logs before pasting them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Level / XP
        - Channel points
        - Drops
        - Daily Reward / challenges
        - Realtime updates
        - Discord notifications
        - Login / session token
        - Docker
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `kick-level-farm --version`, or the release / image tag you use.
      placeholder: "kick-level-farm 0.1.0 (dev-abc1234)"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Docker
        - Prebuilt binary (Linux)
        - Prebuilt binary (Windows)
        - Built from source
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / platform
      placeholder: "Ubuntu 24.04 VPS (arm64), Windows 11, …"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Run with `-v` for debug logs (Docker: `docker compose logs --tail 200`). Remove any tokens first."
      render: text

  - type: textarea
    id: config
    attributes:
      label: Config (optional)
      description: Relevant parts of `config.toml`, **without** the token or webhook URL.
      render: toml
