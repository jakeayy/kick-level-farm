name: release

# Stable release when the Cargo.toml version has no release yet, otherwise a
# pre-release (dev build) that replaces the previous one.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Never run two release jobs at once (pre-release cleanup would race).
concurrency:
  group: release
  cancel-in-progress: false

env:
  BIN: kick-level-farm

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          short=$(git rev-parse --short=7 HEAD)
          if gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            prerelease=true
            tag="dev-$short"
          else
            prerelease=false
            tag="v$version"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "### $tag (prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Required when the action is pinned to a SHA (it can't infer it from the ref name).
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          name="$BIN-$TAG-$TARGET"
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/$BIN.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          else
            cp "target/$TARGET/release/$BIN" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # build provenance attestations
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # Only for CHANGELOG.md (release notes).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Signed SLSA provenance: proves each archive was built by this workflow from this commit.
      # Verify with: gh attestation verify <file> --repo jakeayy/kick-level-farm
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Release notes from CHANGELOG.md
        run: |
          # Prints the body of a "## [name]" section of CHANGELOG.md (empty if missing).
          section() {
            awk -v h="## [$1]" 'index($0, h) == 1 { f = 1; next } /^## \[/ || /^\[[^]]+\]: / { if (f) exit } f' CHANGELOG.md 2>/dev/null
          }
          verify='Verify a download: `gh attestation verify <file> --repo '"$REPO"'`'
          if [ "${{ needs.plan.outputs.prerelease }}" = true ]; then
            section Unreleased > changes.md
          else
            section "$VERSION" > changes.md
          fi
          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' changes.md
          printf '\n\n---\n%s\n' "$verify" > footer.md
          echo "changelog section: $(wc -l < changes.md) line(s)"

      # Only one dev build is kept; a new stable release supersedes it too.
      - name: Remove old pre-releases
        run: |
          gh release list --repo "$REPO" --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
          while read -r old; do
            [ -n "$old" ] || continue
            echo "deleting pre-release $old"
            gh release delete "$old" --repo "$REPO" --yes --cleanup-tag
          done

      - name: Create pre-release
        if: needs.plan.outputs.prerelease == 'true'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual run' }}
        run: |
          {
            echo "Development build of \`${GITHUB_SHA::7}\` (on top of v$VERSION). Replaced by every new push."
            echo
            echo "**Commit:** $COMMIT_MSG"
            if [ -s changes.md ]; then
              echo
              echo "### Unreleased changes"
              echo
              cat changes.md
            fi
            cat footer.md
          } > notes.md
          gh release create "$TAG" dist/* --repo "$REPO" --target "$GITHUB_SHA" \
            --prerelease --title "Dev build ${GITHUB_SHA::7}" --notes-file notes.md

      - name: Create release
        if: needs.plan.outputs.prerelease != 'true'
        run: |
          if [ -s changes.md ]; then
            cat changes.md footer.md > notes.md
            gh release create "$TAG" dist/* --repo "$REPO" --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file notes.md --latest
          else
            echo "::warning::No '## [$VERSION]' section in CHANGELOG.md, using generated notes"
            gh release create "$TAG" dist/* --repo "$REPO" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes --latest
          fi
