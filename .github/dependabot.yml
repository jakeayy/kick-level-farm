version: 2
updates:
  # Rust crates: one grouped PR per week for minor/patch updates.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images in the Dockerfile (rust:alpine builder, alpine runtime).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
