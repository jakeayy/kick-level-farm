# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check` (install: `cargo install --locked cargo-deny`).

[graph]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerabilities and unsound crates always fail; unmaintained crates only matter if we use them directly.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Everything must be compatible with this project's GPL-3.0 license.
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0", # webpki-roots (Mozilla's CA list)
  "GPL-3.0-only",        # this project
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
